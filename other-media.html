<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css?v=2" />
    <link rel="icon" type="image/png" href="images/K.png" />
    <title>Other Print &amp; Digital Media | Karyn Kingrey Portfolio</title>
  </head>
  <body
    style="
      background-image: url(&quot;beigeBG.png&quot;);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    "
  >
    <div class="container">
      <div id="navbar-container"></div>
      <div class="project-page">
        <div class="w-100">
          <div class="row g-5 py-4 align-items-start">
            <div class="col-12 col-md-7">
              <img src="images/InquisiTours.png" class="img-fluid w-100 hero-image" alt="Other Print &amp; Digital Media" />
              <img src="images/InquisiTours-emails.png" class="img-fluid w-100 hero-image mt-4" alt="InquisiTours emails" />
              <img src="images/InquisiTours-pdf.png" class="img-fluid w-100 hero-image mt-4" alt="InquisiTours PDF" />
            </div>
            <div class="col-12 col-md-5">
              <h1 class="name-header">Other Print &amp; Digital Media</h1>
              <p>Project description coming soon.</p>
              <img src="images/imission-flyer.png" class="img-fluid w-100 hero-image mt-3" alt="iMission flyer" />
              <img src="images/school-flyer.png" class="img-fluid w-100 hero-image mt-4" alt="School flyer" />
              <img src="images/school2-flyer.png" class="img-fluid w-100 hero-image mt-4" alt="School flyer, second design" />
              <a href="projects" class="btn btn-primary">Back to Projects</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      fetch("navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar-container").innerHTML = data;
        });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
