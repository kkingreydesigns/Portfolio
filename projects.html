<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css?v=2" />
    <title>Karyn Kingrey Portfolio</title>
  </head>
  <body
    style="
      background-image: url(&quot;beigeBG.png&quot;);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    "
  >
    <div class="container">
      <div id="navbar-container"></div>
      <div class="hero">
        <div class="w-100">
          <div class="row g-4 py-4">
            <div class="col-12 col-md-4">
              <div class="p-4 h-100">
                <div class="project-card">
                  <video
                    src="images/30x30-video.mp4"
                    class="img-fluid w-100"
                    autoplay
                    muted
                    loop
                    playsinline
                  ></video>
                  <div class="project-overlay">
                    <p class="project-text">30X30 Solutions Web Mockup</p>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="p-4 h-100">
                <div class="project-card">
                  <img src="images/ct.png" class="img-fluid w-100" alt="Project 2" />
                  <div class="project-overlay">
                    <p class="project-text">Sustainable CT Web Mockup</p>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="p-4 h-100">
                <div class="project-card">
                  <img src="images/mockup-placeholder.png" class="img-fluid w-100" alt="Project 3" />
                  <div class="project-overlay">
                    <p class="project-text">Project 3 description</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="row g-4 py-4">
            <div class="col-12 col-md-4">
              <div class="p-4 h-100">
                <div class="project-card">
                  <img src="images/mockup-placeholder.png" class="img-fluid w-100" alt="Project 4" />
                  <div class="project-overlay">
                    <p class="project-text">Project 4 description</p>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="p-4 h-100">
                <div class="project-card">
                  <video
                    src="images/LAAVP-video.mp4"
                    class="img-fluid w-100"
                    autoplay
                    muted
                    loop
                    playsinline
                  ></video>
                  <div class="project-overlay">
                    <p class="project-text"> LAAVP Web Design and Build</p>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <div class="p-4 h-100">
                <div class="project-card">
                  <img src="images/InquisiTours.png" class="img-fluid w-100" alt="InquisiTours" />
                  <div class="project-overlay">
                    <p class="project-text">Other Print & Digital Media</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      fetch("navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar-container").innerHTML = data;
        });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
